<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pusat Komando Vending Machine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1a0629; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .login-card { background: #290a42; padding: 40px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 4px solid #c21564; }
        h2 { margin-bottom: 25px; text-align: center; color: #fff; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ddd; }
        input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #4a1c6a; background: #1a0629; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #c21564; }
        button { width: 100%; padding: 12px; background: #c21564; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #a01050; }
        .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; text-align: center; }
        .contact-footer { position: fixed; bottom: 20px; left: 0; width: 100%; padding: 0 20px; text-align: center; color: #ddd; font-size: 0.85rem; }
        .contact-footer a { color: #fff; font-weight: bold; text-decoration: underline; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 28px 20px; }
            .contact-footer { bottom: 10px; font-size: .78rem; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 Autentikasi Admin</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Terdaftar</label>
                <input type="email" id="email" required placeholder="admin@teknik.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="btnSubmit">Masuk ke Dasbor</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <footer class="contact-footer">
        Jika ada masalah, hubungi
        <a href="https://www.tiktok.com/@Aetherion_Gio" target="_blank" rel="noopener noreferrer">TikTok</a>
        atau
        <a href="https://www.instagram.com/Aetherion_Gio/" target="_blank" rel="noopener noreferrer">Instagram Aetherion_Gio</a>.
    </footer>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Konfigurasi Firebase dari akunmu
        const firebaseConfig = {
            apiKey: "AIzaSyCQOfg2mGZ_2es934D_Ap6cpEhpsPB23Dw",
            authDomain: "vending-machine-a267f.firebaseapp.com",
            databaseURL: "https://vending-machine-a267f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vending-machine-a267f",
            storageBucket: "vending-machine-a267f.firebasestorage.app",
            messagingSenderId: "102814152086",
            appId: "1:102814152086:web:d7a35242e387de11ad99b7",
            measurementId: "G-99L5DS69H5"
        };

        firebase.initializeApp(firebaseConfig);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.innerText = "Memverifikasi identitas...";
            
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                // 1. Login ke Firebase Auth
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const idToken = await userCredential.user.getIdToken();

                // 2. Kirim ke server untuk diperiksa Whitelist-nya
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken, email })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/admin.html';
                } else {
                    errorMsg.innerText = result.error || "Akses ditolak!";
                }

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Gagal masuk: Periksa kembali email dan password Anda.";
            }
        });
    </script>
</body>
</html>
